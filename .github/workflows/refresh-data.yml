name: Refresh Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all data
        run: |
          mkdir -p data

          curl -sL -o data/au_qld_live.csv "https://publicdata.au/d/qld-emergency-department-waits-now/latest/data.csv" || true
          curl -sL -o data/au_qld_hospitals.csv "https://publicdata.au/d/qld-emergency-department-facilities/latest/data.csv" || true

          MONTH=$(date -u +%Y-%m)
          curl -sL -o data/au_nsw_raw.csv "https://raw.githubusercontent.com/primaraau/ed-wait-log/main/data/${MONTH}.csv" || true
          if [ ! -s data/au_nsw_raw.csv ]; then
            LASTMONTH=$(date -u -d "last month" +%Y-%m 2>/dev/null || echo "")
            if [ -n "$LASTMONTH" ]; then
              curl -sL -o data/au_nsw_raw.csv "https://raw.githubusercontent.com/primaraau/ed-wait-log/main/data/${LASTMONTH}.csv" || true
            fi
          fi
          if [ -s data/au_nsw_raw.csv ]; then
            awk -F',' 'NR==1{print; next} {last[$1]=$0} END{for(k in last) print last[k]}' data/au_nsw_raw.csv > data/au_nsw_live.csv
            rm -f data/au_nsw_raw.csv
          else
            echo "hospital,patient_wait_count,source_updated_utc,usual_patients,bed_count" > data/au_nsw_live.csv
          fi

          curl -sL -o data/au_ed_time_in_ed.csv "https://publicdata.au/d/au-ed-time-in-ed/latest/data.csv" || true

          echo "{\"updated\":\"$(date -u +%Y-%m-%d)\"}" > data/meta.json

      - name: Push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add data/
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push origin main   
