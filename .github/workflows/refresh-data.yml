name: Refresh Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all data
        run: |
          mkdir -p data
          curl -sL -o data/au_qld_live.csv "https://publicdata.au/d/qld-emergency-department-waits-now/latest/data.csv" || true
          curl -sL -o data/au_qld_hospitals.csv "https://publicdata.au/d/qld-emergency-department-list/latest/data.csv" || true
          curl -sL -o data/au_ed_time_in_ed.csv "https://publicdata.au/d/au-ed-time-in-ed/latest/data.csv" || true
          curl -sL -o data/au_ed_4hour.csv "https://publicdata.au/d/au-ed-patients-seen-on-time/latest/data.csv" || true
          curl -sL -o data/au_surgical_waits.csv "https://publicdata.au/d/au-elective-surgery-waiting-times/latest/data.csv" || true
          echo "{\"updated\":\"$(date -u +%Y-%m-%d)\"}" > data/meta.json

      - name: Push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add data/
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push origin main   
