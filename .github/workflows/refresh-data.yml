name: Refresh Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      # ═══ QLD Live ED Waits (40 hospitals, daily) ═══
      - name: Download QLD Live ED
        run: |
          curl -sL -o data/au_qld_live.csv \
            "https://publicdata.au/d/qld-emergency-department-waits-now/latest/data.csv" || true

      # ═══ QLD Hospital Names (for the join) ═══
      - name: Download QLD Hospital Names
        run: |
          curl -sL -o data/au_qld_hospitals.csv \
            "https://publicdata.au/d/qld-emergency-department-list/latest/data.csv" || true

      # ═══ NSW Live ED (60 hospitals, every 15 min) ═══
      # From primaraau/ed-wait-log GitHub repo
      # URL pattern: data/YYYY-MM.csv (current month)
      - name: Download NSW Live ED
        run: |
          MONTH=$(date -u +%Y-%m)
          curl -sL -o data/au_nsw_raw.csv \
            "https://raw.githubusercontent.com/primaraau/ed-wait-log/main/data/${MONTH}.csv" || true
          # If this month's file doesn't exist, try last month
          if [ ! -s data/au_nsw_raw.csv ]; then
            LASTMONTH=$(date -u -d "last month" +%Y-%m)
            curl -sL -o data/au_nsw_raw.csv \
              "https://raw.githubusercontent.com/primaraau/ed-wait-log/main/data/${LASTMONTH}.csv" || true
          fi
          # Keep only the latest row per hospital (last occurrence)
          if [ -s data/au_nsw_raw.csv ]; then
            awk -F',' 'NR==1{print; next} {last[$1]=$0} END{for(k in last) print last[k]}' \
              data/au_nsw_raw.csv > data/au_nsw_live.csv
            rm data/au_nsw_raw.csv
          else
            echo "hospital,patient_wait_count,source_updated_utc,usual_patients,bed_count" > data/au_nsw_live.csv
          fi

      # ═══ AU ED Time in ED (all states, quarterly) ═══
      - name: Download AU ED
        run: |
          curl -sL -o data/au_ed_time_in_ed.csv \
            "https://publicdata.au/d/au-ed-time-in-ed/latest/data.csv" || true

      # ═══ AU 4-Hour Rule (all states, quarterly) ═══
      - name: Download AU 4-Hour
        run: |
          curl -sL -o data/au_ed_4hour.csv \
            "https://publicdata.au/d/au-ed-patients-seen-on-time/latest/data.csv" || true

      # ═══ AU Surgical Waits (all states, quarterly) ═══
      - name: Download AU Surgical
        run: |
          curl -sL -o data/au_surgical_waits.csv \
            "https://publicdata.au/d/au-elective-surgery-waiting-times/latest/data.csv" || true

      # ═══ Meta ═══
      - name: Write meta
        run: |
          echo "{\"updated\":\"$(date -u +%Y-%m-%d)\"}" > data/meta.json

      # ═══ Commit ═══
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push   
